[dependency-groups]
dev = [
  "ansible-core>=2.18,<2.22",
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.13,<1",
  "twine>=7,<8",
]

[tool.uv]
environments = ["python_full_version < '3.15'"]
required-version = "==0.12.16"

[tool.uv.sources]
swos-core = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/cli",
  "packages/ansible",
  "packages/devices/css106",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = [
  "packages/core/tests",
  "packages/cli/tests",
  "packages/ansible/tests",
  "packages/devices/css106/tests",
  "tests",
]
markers = [
  "integration: tests that require a physical SwOS device",
  "destructive: integration tests that modify a device",
  "password_rotation: separately gated administrator password rotation test",
  "management_reconnect: separately gated management lockout/reconnect tests",
]

[tool.coverage.run]
branch = true
source = ["swos_core", "swos_cli", "swos_ansible", "swos_device_css106"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"packages/ansible/src/ansible_collections/**/plugins/modules/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["swos_core", "swos_cli", "swos_ansible", "swos_device_css106"]
mypy_path = [
  "packages/core/src",
  "packages/cli/src",
  "packages/ansible/src",
  "packages/devices/css106/src",
]

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true
