[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = [
  "packages/core/tests",
  "packages/cli/tests",
  "packages/devices/css106/tests",
  "tests",
]
markers = [
  "integration: tests that require a physical SwOS device",
  "destructive: integration tests that modify a device",
]

[tool.coverage.run]
branch = true
source = ["swos_core", "swos_cli", "swos_device_css106"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["swos_core", "swos_cli", "swos_device_css106"]
mypy_path = [
  "packages/core/src",
  "packages/cli/src",
  "packages/devices/css106/src",
]

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true
