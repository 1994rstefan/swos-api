name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Build distributions
        run: |
          python -m build --outdir dist packages/core
          python -m build --outdir dist packages/cli
          python -m build --outdir dist packages/devices/css106
      - name: Validate distributions
        run: twine check dist/*
      - name: Test installed wheels
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/swosctl -o json --version
          .wheel-venv/bin/python -c "from swos_core import PluginRegistry; assert PluginRegistry.discover().known_families == ('css106',)"
