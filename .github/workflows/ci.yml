name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.16"
          enable-cache: true
      - name: Install project
        run: uv sync --locked --all-packages
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Test
        run: uv run --no-sync pytest --cov --cov-report=term-missing

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          version: "0.12.16"
          enable-cache: true
      - name: Install build tools
        run: uv sync --locked --all-packages
      - name: Build distributions
        run: uv build --all-packages --out-dir dist
      - name: Validate Ansible collection
        working-directory: packages/ansible/src/ansible_collections/swos/api
        run: uv run --no-sync ansible-test sanity --python 3.14
      - name: Validate distributions
        run: uv run --no-sync twine check dist/*
      - name: Test installed wheels
        run: |
          uv venv .wheel-venv --python 3.14
          uv export --locked --no-emit-workspace | uv pip install --python .wheel-venv/bin/python --require-hashes -r -
          uv pip install --python .wheel-venv/bin/python --no-deps dist/*.whl
          .wheel-venv/bin/swosctl -o json --version
          .wheel-venv/bin/ansible-doc swos.api.facts >/dev/null
          .wheel-venv/bin/python -c "from swos_core import PluginRegistry; assert PluginRegistry.discover().known_families == ('css106',)"
