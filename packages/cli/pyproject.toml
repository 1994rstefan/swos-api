[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swos-cli"
version = "0.8.0"
description = "Command-line client for the swos-core API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "1994rstefan" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "platformdirs>=4.4,<5",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "rich>=14,<15",
  "swos-core>=0.8.0,<0.9.0",
  "typer>=0.19,<1",
]

[project.scripts]
swosctl = "swos_cli.app:run"

[project.urls]
Homepage = "https://github.com/1994rstefan/swos-api"
Repository = "https://github.com/1994rstefan/swos-api"
Issues = "https://github.com/1994rstefan/swos-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swos_cli"]
