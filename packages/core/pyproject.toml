[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swos-core"
version = "0.1.3"
description = "Device-agnostic Python API for managing MikroTik SwOS devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "1994rstefan" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/1994rstefan/swos-api"
Repository = "https://github.com/1994rstefan/swos-api"
Issues = "https://github.com/1994rstefan/swos-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swos_core"]
