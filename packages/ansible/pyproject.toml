[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swos-ansible"
version = "0.1.0"
description = "Ansible collection for the swos-core API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
authors = [{ name = "1994rstefan" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Ansible",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["swos-core>=0.8.1,<0.13.0"]

[project.urls]
Homepage = "https://github.com/1994rstefan/swos-api"
Repository = "https://github.com/1994rstefan/swos-api"
Issues = "https://github.com/1994rstefan/swos-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swos_ansible", "src/ansible_collections"]
